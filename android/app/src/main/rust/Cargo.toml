[package]
name = "monochrome-native-audio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
cpal = "0.15"
jni = "0.21"
parking_lot = "0.12"
crossbeam-channel = "0.5"
thiserror = "2.0"
log = "0.4"
android_logger = "0.14"
once_cell = "1.19"
anyhow = "1.0"

[features]
default = ["symphonia"]
ffmpeg = ["dep:ffmpeg-next"]
symphonia = ["dep:symphonia"]

[dependencies.ffmpeg-next]
version = "7.1"
optional = true

[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.9"
ndk-context = "0.1"
ndk-sys = "0.6"

[dependencies.symphonia]
version = "0.5"
optional = true
features = ["all-formats", "all-codecs"]
