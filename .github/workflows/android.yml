name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.0
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual triggering

# CRITICAL: This permission is required to create a GitHub Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Android Overlay
        uses: actions/checkout@v4
        with:
          path: overlay
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            overlay/package-lock.json
            upstream/package-lock.json
            
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          override: true

      - name: Add additional Rust targets
        run: |
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install Android NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Clone Upstream Monochrome
        run: |
          git clone https://github.com/monochrome-music/monochrome.git upstream
          cd upstream
          git remote rename origin upstream
          
      - name: Install Overlay and Patch Dependencies
        run: |
          # 1. Install overlay files
          chmod +x overlay/install.sh
          ./overlay/install.sh ./upstream
          cd upstream
          
          # 2. Fix broken upstream dependencies (sourcemap-codec issue)
          npm pkg set overrides.sourcemap-codec=1.4.8
          
          # 3. Remove miniflare (causes build-from-source sharp errors)
          npm uninstall miniflare --save-dev || true
          
          # 4. Update build script for CI environment
          # Remove Mac paths and use CI environment variables
          sed -i 's|export JAVA_HOME=.*||g' build-android.sh
          sed -i 's|export ANDROID_HOME=.*||g' build-android.sh
          sed -i 's|export ANDROID_SDK_ROOT=.*||g' build-android.sh
          sed -i 's|export PATH=\$JAVA_HOME/bin.*||g' build-android.sh
          
          # Remove the build-anyway prompt
          sed -i 's|read -p.*||g' build-android.sh
          sed -i 's|\[\[ ! \$REPLY =~ \^\[Yy\]\$ \]\] && exit 0||g' build-android.sh
          
          # Fix Linux sed syntax (remove empty string after -i)
          sed -i "s/sed -i ''/sed -i/g" build-android.sh
          
      - name: Fix Java Source Files
        run: |
          cd upstream
          # Remove backticks from all Java annotations (before, after, and around @)
          find android -name "*.java" -type f -exec sed -i 's/`@/@/g' {} +
          find android -name "*.java" -type f -exec sed -i 's/@`/@/g' {} +
          # Remove any trailing backticks after annotation names
          find android -name "*.java" -type f -exec sed -i 's/\([a-zA-Z]\)`/\1/g' {} +
          
      - name: Build Web App & Android APK
        run: |
          cd upstream
          # Install dependencies and build
          npm install
          npm install --save @capacitor/core @capacitor/cli @capacitor/android @capacitor/status-bar
          
          # Run the build script (now patched for CI)
          chmod +x build-android.sh
          ./build-android.sh
          
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monochrome-debug-apk
          path: upstream/Monochrome-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: upstream/Monochrome-debug.apk
          tag_name: nightly # Using a specific 'nightly' tag
          name: "Latest Build (Nightly)"
          body: |
            Auto-generated nightly build.
            Built on: ${{ github.event.head_commit.timestamp }}
            Commit: ${{ github.sha }}
          prerelease: true
          make_latest: true # Ensures this is marked as the latest release
